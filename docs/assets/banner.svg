<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07080D"/>
      <stop offset="50%" stop-color="#0B0D16"/>
      <stop offset="100%" stop-color="#08070F"/>
    </linearGradient>
    <radialGradient id="auraL" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 320) rotate(-18) scale(480 220)">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0B0D16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraR" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(940 310) rotate(14) scale(460 210)">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#F59E0B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B0D16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="prismRim" x1="120" y1="32" x2="1080" y2="328" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5CC6FC" stop-opacity="0.55"/>
      <stop offset="32%" stop-color="#8B5CF6" stop-opacity="0.72"/>
      <stop offset="68%" stop-color="#F472B6" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="250" y1="110" x2="880" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="58%" stop-color="#E2E8F8"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="prismIcon" x1="18" y1="6" x2="66" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5CC6FC"/>
      <stop offset="48%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B0764"/>
      <stop offset="38%" stop-color="#6D28D9"/>
      <stop offset="76%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="24" fill="url(#auraL)"/>
  <rect width="1200" height="360" rx="24" fill="url(#auraR)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" stroke="url(#prismRim)" stroke-opacity="0.48" stroke-width="1.5"/>

  <!-- Left Prism Emblem -->
  <g transform="translate(88 94)">
    <rect x="0" y="0" width="84" height="84" rx="22" fill="#121420" stroke="url(#prismRim)" stroke-width="1.4"/>
    <path d="M42 15L66 63H18L42 15Z" stroke="url(#prismIcon)" stroke-width="2.6" fill="url(#prismIcon)" fill-opacity="0.16" stroke-linejoin="round"/>
    <path d="M42 15V63" stroke="#E2E8F8" stroke-opacity="0.45" stroke-width="1.3"/>
    <path d="M42 40L66 63" stroke="#F472B6" stroke-opacity="0.5" stroke-width="1.2"/>
    <circle cx="42" cy="40" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="196" y="144" fill="url(#titleGrad)" font-family="Segoe UI, Inter, -apple-system, sans-serif" font-size="52" font-weight="750" letter-spacing="-1.2">Obsidian Studio</text>
  <text x="198" y="180" fill="#9BA6BF" font-family="Segoe UI, Inter, -apple-system, sans-serif" font-size="19" font-weight="450">Estúdio web local óptico para Google Antigravity CLI · Gemini 4 Neon Extra High</text>

  <!-- Feature Pills -->
  <g transform="translate(196 208)" font-family="Consolas, ui-monospace, monospace" font-size="12.5" font-weight="600">
    <rect x="0" y="0" width="166" height="30" rx="15" fill="#131624" stroke="#8B5CF6" stroke-opacity="0.48"/>
    <text x="16" y="19.5" fill="#DDD6FE">✦ GEMINI 4 NEON XHIGH</text>

    <rect x="178" y="0" width="154" height="30" rx="15" fill="#131624" stroke="#5CC6FC" stroke-opacity="0.42"/>
    <text x="194" y="19.5" fill="#BAE6FD">◈ 0 DEPENDENCIES</text>

    <rect x="344" y="0" width="160" height="30" rx="15" fill="#131624" stroke="#F472B6" stroke-opacity="0.42"/>
    <text x="360" y="19.5" fill="#FBCFE8">↻ CONTEXT CARRYOVER</text>

    <rect x="516" y="0" width="142" height="30" rx="15" fill="#131624" stroke="#4ADE80" stroke-opacity="0.4"/>
    <text x="532" y="19.5" fill="#BBF7D0">⇶ QUEUED &amp; STEER</text>
  </g>

  <!-- Right Mini Optical Effort + Vial Card -->
  <g transform="translate(892 84)">
    <rect width="224" height="190" rx="18" fill="#0F111B" fill-opacity="0.9" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="18" y="30" fill="#94A3B8" font-family="Consolas, ui-monospace, monospace" font-size="11">REASONING EFFORT</text>
    <text x="172" y="30" fill="#E879F9" font-family="Consolas, ui-monospace, monospace" font-size="11" font-weight="700">EXTRA</text>
    <rect x="18" y="42" width="188" height="22" rx="11" fill="#1B1E2E"/>
    <rect x="18" y="42" width="188" height="22" rx="11" fill="url(#barGrad)"/>
    <circle cx="195" cy="53" r="9.5" fill="#FFFFFF"/>
    <circle cx="58" cy="50" r="1.4" fill="#FFFFFF" fill-opacity="0.9"/>
    <circle cx="94" cy="56" r="1.1" fill="#FFFFFF" fill-opacity="0.75"/>
    <circle cx="132" cy="49" r="1.5" fill="#FFFFFF" fill-opacity="0.95"/>
    <circle cx="162" cy="55" r="1.2" fill="#FFFFFF" fill-opacity="0.8"/>

    <!-- Mini Telemetry Bars -->
    <text x="18" y="94" fill="#94A3B8" font-family="Consolas, ui-monospace, monospace" font-size="11">512K CONTEXT VIAL</text>
    <rect x="18" y="106" width="188" height="7" rx="3.5" fill="#1C2030"/>
    <rect x="18" y="106" width="44" height="7" rx="3.5" fill="#5CC6FC"/>
    <rect x="65" y="106" width="58" height="7" rx="3.5" fill="#669DF6"/>
    <rect x="126" y="106" width="28" height="7" rx="3.5" fill="#A58AF8"/>

    <!-- Author Chip -->
    <rect x="18" y="136" width="188" height="34" rx="10" fill="#161926" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="36" cy="153" r="5" fill="#4ADE80"/>
    <text x="50" y="157" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="600">by @touchzada</text>
    <text x="150" y="157" fill="#64748B" font-family="Consolas, monospace" font-size="10.5">v1.0</text>
  </g>

  <!-- Bottom Attribution Line -->
  <text x="88" y="324" fill="#64748B" font-family="Consolas, ui-monospace, monospace" font-size="12">Criado por Luciano Gomes (@touchzada) · github.com/touchzada/Obsidian-Studio</text>
</svg>
